services:
  db:
    container_name: postgis
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: findhub
      POSTGRES_PASSWORD: tracker
      POSTGRES_USER: tracker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d findhub"]
      timeout: 10s
      interval: 10s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql

  backend:
    container_name: backend
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tracker:tracker@db:5432/findhub
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./auth:/app/auth:ro

  web:
    container_name: web
    build: ./web
    ports:
      - "8180:80"
    depends_on:
      - backend

volumes:
  pgdata: